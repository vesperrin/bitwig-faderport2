plugins {
    id 'java'
}

repositories {
    maven {
        url = uri('https://maven.bitwig.com/')
    }
}

dependencies {
    implementation "com.bitwig:extension-api:${bitwigApiVersion}"
}

group = 'com.smetoyer.bitwig'
version = "${project.version}"
description = 'PreSonus FaderPort v2 Controller Extension for Bitwig Studio'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    archiveFileName = 'PreSonusFaderPort2.bwextension'

    doLast {
        def bitwigExtDir = file("${System.getProperty('user.home')}/Documents/Bitwig Studio/Extensions")
        if (bitwigExtDir.exists()) {
            copy {
                from archiveFile
                into bitwigExtDir
            }
            println "✓ Extension installed to ${bitwigExtDir}"
        } else {
            println "⚠ Bitwig Extensions directory not found: ${bitwigExtDir}"
            println "  Run Bitwig Studio to create the directory, then run build again"
        }
        // Also copy the built extension into the repository `dist/` folder
        def distDir = file("${project.projectDir}/dist")
        if (!distDir.exists()) {
            distDir.mkdirs()
        }
        copy {
            from archiveFile
            into distDir
        }
        println "✓ Extension copied to ${distDir}"
    }
}
